# Continuous integration: every phase ends with this workflow green
# (SPEC section 12). Actions are pinned by commit SHA (the tag is in the
# comment), because a tag can be moved to different code.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: generate, lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the version of go.mod's toolchain directive (go1.27.1).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The web types are generated too, so this job needs Node as well.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      - name: Generated code matches the contract
        run: make check-generated

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      # Integration tests start PostgreSQL through the runner's Docker.
      - name: Test
        run: make go-test

      - name: Build
        run: make build

  web:
    name: web lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      # ESLint with the i18n rule, Prettier and tsc.
      - name: Lint
        run: make web-lint

      - name: Test
        run: make web-test

      - name: Build
        run: make web-build

  image:
    name: image build and smoke test
    needs: [go, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Podman ships with the ubuntu-24.04 runner image. Nothing is pushed.
      - name: Build image
        run: make image

      - name: Smoke test
        run: deploy/smoke-test.sh

      # The end-to-end test builds the fake push service and VAPID keys
      # with Go and runs Playwright with Node.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      # The Chromium build that matches the pinned @playwright/test, with
      # the system libraries it needs; the full browser only, without the
      # headless shell (see web/playwright.config.ts).
      - name: Install Playwright's Chromium
        run: |
          make web/node_modules/.installed
          cd web && npx playwright install --with-deps --no-shell chromium

      - name: End-to-end test
        run: make e2e
