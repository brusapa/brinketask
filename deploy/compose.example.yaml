# Example production deployment: PostgreSQL and brinketask on one host,
# behind a reverse proxy that terminates TLS (docs/deployment.md). Copy it
# next to brinketask.env and db.env, made from the *.env.example files,
# and to a file named .env that sets the image tag, which compose reads by
# itself:
#
#   echo BRINKETASK_VERSION=<version> > .env
#   podman compose -f compose.example.yaml up -d
#
# It holds no secrets.
name: brinketask

services:
  db:
    image: docker.io/library/postgres:18.6-alpine3.24
    env_file: db.env # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: brinketask
      POSTGRES_DB: brinketask
    volumes:
      # Since PostgreSQL 18 the data lives in a versioned subdirectory of
      # /var/lib/postgresql, so the volume mounts the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brinketask", "-d", "brinketask"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  app:
    # Built from a release of the repository (docs/deployment.md):
    #   podman build -f deploy/Dockerfile -t localhost/brinketask:<version> .
    # The tag comes from .env (above); compose stops with this message
    # when it is missing.
    image: localhost/brinketask:${BRINKETASK_VERSION:?set BRINKETASK_VERSION in .env to the tag you built}
    env_file: brinketask.env # DATABASE_URL, OIDC_*, VAPID_*, PUBLIC_URL
    ports:
      # Only the reverse proxy on this host reaches the application.
      - "127.0.0.1:8080:8080"
    # Port 9090 serves /metrics (D-72). It is not published: Prometheus
    # reaches it on the compose network (http://app:9090/metrics).
    expose:
      - "9090"
    # The process writes nothing to disk and needs no privileges.
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
