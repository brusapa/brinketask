# Development environment: PostgreSQL, a Pocket ID to log in against, and
# the application built from deploy/Dockerfile. Not for production (phase 6
# documents deployment).
#
#   make dev        start everything; prints a one-time login link
#   make dev-down   stop it; the volumes are kept
#
# Ports bind to 127.0.0.1 only. The credentials and keys below are fixed
# development values for services that are only reachable from this
# machine; they are not secrets and must never be reused elsewhere. The
# OIDC client secret is generated by deploy/dev-oidc-setup.sh into
# deploy/dev.env, which git ignores.
name: brinketask-dev

services:
  db:
    # Keep in step with internal/testdb.Image.
    image: docker.io/library/postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: brinketask
      POSTGRES_PASSWORD: brinketask
      POSTGRES_DB: brinketask
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Since PostgreSQL 18 the image keeps its data in a versioned
      # subdirectory of /var/lib/postgresql, so the volume mounts the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brinketask", "-d", "brinketask"]
      interval: 2s
      timeout: 2s
      retries: 30

  pocket-id:
    # Pocket ID v2.18.0 (BSD-2-Clause), the provider SPEC section 7 targets.
    image: ghcr.io/pocket-id/pocket-id:v2.18.0@sha256:323e7ef5bfacf7cf32f22f3d10ccdf48e0c97c94d67e7e40b0b996830deb5165
    environment:
      APP_URL: http://localhost:1411
      ENCRYPTION_KEY: brinketask-dev-encryption-key
      # Lets deploy/dev-oidc-setup.sh manage users and clients through the
      # API (X-API-Key header) without an admin passkey.
      STATIC_API_KEY: brinketask-dev-static-api-key
      TRUST_PROXY: "false"
      ANALYTICS_DISABLED: "true"
    ports:
      - "127.0.0.1:1411:1411"
      # The app's port: the app shares this container's network (below).
      - "127.0.0.1:8080:8080"
    volumes:
      - pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # The issuer must be the same URL for the browser and for the server:
    # go-oidc rejects tokens whose "iss" differs from OIDC_ISSUER. Sharing
    # Pocket ID's network namespace makes http://localhost:1411 reach Pocket
    # ID from inside the app too, as it does from the browser.
    network_mode: service:pocket-id
    env_file: dev.env # OIDC_CLIENT_ID and OIDC_CLIENT_SECRET
    environment:
      DATABASE_URL: postgres://brinketask:brinketask@db:5432/brinketask?sslmode=disable
      LOG_LEVEL: debug
      PUBLIC_URL: http://localhost:8080
      OIDC_ISSUER: http://localhost:1411
    # Same restrictions as production (SPEC section 10).
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
      pocket-id:
        condition: service_healthy

volumes:
  db-data:
  pocket-id-data:
