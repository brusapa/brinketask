<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>brinketask</title>
    <!-- The installable app (SPEC section 2): manifest, icons and the bar
         colour of each theme. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)" />
    <!-- See public/pressable.css: replaces a style element React Aria would
         insert, which the Content-Security-Policy blocks. -->
    <link id="react-aria-pressable-style" rel="stylesheet" href="/pressable.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
