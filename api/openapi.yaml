openapi: 3.0.3
info:
  title: brinketask API
  version: 1.0.0-draft
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    Tasks and reminders API. See SPEC.md for behaviour and design decisions (D-xx, R-x).

    Conventions:
    - Resource IDs are UUIDs generated by the client (v7 recommended).
    - Create (POST) is idempotent: repeating it with an existing `id` owned by the
      caller returns the existing resource with 200, as it is (a deleted resource
      is not revived). An `id` owned by another user answers 409 (SPEC D-23).
    - PATCH uses JSON Merge Patch (RFC 7396): only the fields sent are modified.
    - DELETE is a soft delete. Deleted resources keep appearing in /sync/changes
      as tombstones (`deleted_at` set).
    - Timestamps are RFC 3339 in UTC. Calendar dates are YYYY-MM-DD. Local times are HH:MM.
    - Errors use application/problem+json (RFC 9457) plus a stable `code`.
    - A resource the caller has no access to answers 404.
    - Cookie-authenticated state-changing requests must be same-origin, otherwise 403.

    Operational routes live outside this API and are not described here:
    - Browser authentication: GET /auth/login, GET /auth/callback, POST /auth/logout.
    - GET /healthz: unauthenticated; 200 when the database answers, 503 otherwise.
    - GET /metrics: Prometheus metrics, served on a separate internal port.
    - The web client's static files, served from the same origin.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: me
  - name: lists
  - name: tasks
  - name: checklist
  - name: reminders
  - name: tags
  - name: sync
  - name: push

paths:
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [me]
      operationId: patchMe
      summary: Update profile settings
      description: Changing `timezone` or `all_day_reminder_time` recomputes pending reminders.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /lists:
    get:
      tags: [lists]
      operationId: listLists
      summary: All lists the caller is a member of
      parameters:
        - $ref: '#/components/parameters/Deleted'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/List' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [lists]
      operationId: createList
      summary: Create a list (idempotent on `id`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListCreate' }
      responses:
        '200':
          description: Already existed; returned unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        default: { $ref: '#/components/responses/Problem' }

  /lists/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [lists]
      operationId: getList
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [lists]
      operationId: patchList
      description: The inbox list cannot be renamed (409).
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ListPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [lists]
      operationId: deleteList
      description: Soft-deletes the list and its tasks. The inbox list cannot be deleted (409).
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /lists/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [lists]
      operationId: restoreList
      description: Restores the list and the tasks deleted together with it. 409 after the restore window.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        default: { $ref: '#/components/responses/Problem' }

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Query tasks
      parameters:
        - name: list_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Defaults to `open`.
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: due_from
          in: query
          description: Inclusive lower bound on `due_date`.
          schema: { type: string, format: date }
        - name: due_to
          in: query
          description: Inclusive upper bound on `due_date`.
          schema: { type: string, format: date }
        - name: tag_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Case- and accent-insensitive search on title and description.
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [position, due]
            default: position
        - $ref: '#/components/parameters/Deleted'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task (idempotent on `id`)
      description: May include checklist items and reminders, created in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '200':
          description: Already existed; returned unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tasks]
      operationId: patchTask
      description: |
        `status` accepts only `open` and `dropped` here; use /complete for `done`.
        Changing due fields, `rrule` or `status` recomputes reminders.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TaskPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      operationId: deleteTask
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tasks]
      operationId: restoreTask
      description: 409 after the restore window or if the parent list is deleted.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tasks]
      operationId: completeTask
      summary: Complete a task or the current occurrence of a recurring task
      description: |
        Idempotent on `completion_id`: a repeat answers `applied: true` with the existing
        completion (SPEC D-24). If `occurrence_due_date` does not match the
        task's current `due_date`, nothing is applied (`applied: false`). See SPEC D-10.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteRequest' }
      responses:
        '200':
          description: Current state after the (possibly no-op) operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionResult' }
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}/skip:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tasks]
      operationId: skipTaskOccurrence
      summary: Skip the current occurrence of a recurring task
      description: Same semantics as /complete. 409 if the task is not recurring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteRequest' }
      responses:
        '200':
          description: Current state after the (possibly no-op) operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionResult' }
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}/uncomplete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [tasks]
      operationId: uncompleteTask
      summary: Undo a completion or skip
      description: |
        Restores the state saved in the completion record. Only the latest record of
        the task can be undone (409 otherwise). Unknown `completion_id` is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completion_id]
              properties:
                completion_id: { type: string, format: uuid }
      responses:
        '200':
          description: Current state after the (possibly no-op) operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionResult' }
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}/completions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [tasks]
      operationId: listTaskCompletions
      summary: Completion history, newest first
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Completion' }
                  next_cursor:
                    type: string
                    nullable: true
        default: { $ref: '#/components/responses/Problem' }

  /completions:
    get:
      tags: [tasks]
      operationId: listCompletions
      summary: Completed occurrences across tasks, newest first
      description: |
        Feeds the "Completed" section of a list or view. Returns only records of
        kind `completed`, each with a summary of its task; records whose task is
        deleted are omitted. The client passes the bounds of the current calendar
        day in the user's zone. See SPEC section 8, "Completed section".
      parameters:
        - name: completed_from
          in: query
          required: true
          description: Inclusive lower bound on `completed_at`.
          schema: { type: string, format: date-time }
        - name: completed_to
          in: query
          required: true
          description: Exclusive upper bound on `completed_at`.
          schema: { type: string, format: date-time }
        - name: list_id
          in: query
          schema: { type: string, format: uuid }
        - name: tag_id
          in: query
          schema: { type: string, format: uuid }
        - name: due_from
          in: query
          description: Inclusive lower bound on `occurrence_due_date`.
          schema: { type: string, format: date }
        - name: due_to
          in: query
          description: Inclusive upper bound on `occurrence_due_date`.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CompletionEntry' }
                  next_cursor:
                    type: string
                    nullable: true
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}/snooze:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [reminders]
      operationId: snoozeTask
      summary: Create a one-off `snooze` reminder (idempotent on `reminder_id`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reminder_id, until]
              properties:
                reminder_id: { type: string, format: uuid }
                until: { type: string, format: date-time }
      responses:
        '200':
          description: Already existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}/checklist-items:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [checklist]
      operationId: createChecklistItem
      summary: Add a checklist item (idempotent on `id`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChecklistItemCreate' }
      responses:
        '200':
          description: Already existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChecklistItem' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChecklistItem' }
        default: { $ref: '#/components/responses/Problem' }

  /checklist-items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [checklist]
      operationId: patchChecklistItem
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ChecklistItemPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChecklistItem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [checklist]
      operationId: deleteChecklistItem
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /tasks/{id}/reminders:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [reminders]
      operationId: createReminder
      summary: Add a reminder (idempotent on `id`)
      description: 422 for a `relative` reminder on a task without due date. 409 above 5 reminders.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderCreate' }
      responses:
        '200':
          description: Already existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        default: { $ref: '#/components/responses/Problem' }

  /reminders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [reminders]
      operationId: patchReminder
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ReminderPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [reminders]
      operationId: deleteReminder
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /tags:
    get:
      tags: [tags]
      operationId: listTags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [tags]
      operationId: createTag
      summary: Create a tag (idempotent on `id`)
      description: 409 if another tag of the caller has the same name (case-insensitive).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagCreate' }
      responses:
        '200':
          description: Already existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        default: { $ref: '#/components/responses/Problem' }

  /tags/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [tags]
      operationId: patchTag
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TagPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tags]
      operationId: deleteTag
      description: Soft-deletes the tag and removes it from the `tag_ids` of the caller's tasks.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /sync/changes:
    get:
      tags: [sync]
      operationId: getChanges
      summary: Incremental changes since a cursor
      description: |
        Without `cursor`, returns the full live state. With `cursor`, returns every
        resource changed since then, including tombstones. Tasks come without the
        embedded `checklist_items` and `reminders`; those arrive in their own arrays.
        410 when the cursor is older than tombstone retention: discard local state
        and start again without cursor.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangesPage' }
        '410':
          description: Cursor expired
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /push/vapid-public-key:
    get:
      tags: [push]
      operationId: getVapidPublicKey
      summary: Public key the browser needs to subscribe to Web Push
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key:
                    type: string
                    description: Base64url-encoded P-256 public key.
        default: { $ref: '#/components/responses/Problem' }

  /push/subscriptions:
    get:
      tags: [push]
      operationId: listPushSubscriptions
      summary: Devices registered for notifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PushSubscription' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [push]
      operationId: createPushSubscription
      summary: Register a device (idempotent on `id` and on `endpoint`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionCreate' }
      responses:
        '200':
          description: Already existed; keys refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSubscription' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSubscription' }
        default: { $ref: '#/components/responses/Problem' }

  /push/subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [push]
      operationId: deletePushSubscription
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /push/subscriptions/{id}/test:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [push]
      operationId: testPushSubscription
      summary: Send a test notification to this device
      responses:
        '202': { description: Queued }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: brinketask_session
      description: Opaque server-side session set by /auth/callback. Used by the web client.
    bearerAuth:
      type: http
      scheme: bearer
      description: Reserved for native clients (V2). Not implemented in V1.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by a previous call.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Deleted:
      name: deleted
      in: query
      description: When true, returns only soft-deleted resources still restorable (trash).
      schema: { type: boolean, default: false }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            Stable machine-readable error code (SPEC D-28). New values are added as
            phases need them; existing values never change meaning.
            - `malformed_request` (400): the body is not valid JSON, is missing, or a
              parameter cannot be parsed.
            - `unauthenticated` (401): no valid session.
            - `forbidden` (403): a cross-origin state-changing request.
            - `not_found` (404): the resource does not exist or belongs to someone else.
            - `payload_too_large` (413): the body exceeds 1 MiB (SPEC D-29).
            - `unsupported_media_type` (415): the body has the wrong Content-Type.
            - `validation_failed` (422): the request violates the schema or a rule;
              `errors` lists the fields.
            - `rate_limited` (429): too many requests for the session (SPEC D-29).
            - `internal` (500): an unexpected server error.
            - `not_implemented` (501): the operation arrives in a later phase.
          enum:
            - malformed_request
            - unauthenticated
            - forbidden
            - not_found
            - payload_too_large
            - unsupported_media_type
            - validation_failed
            - rate_limited
            - internal
            - not_implemented
        errors:
          type: array
          description: Per-field validation errors.
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: |
            JSON Pointer (RFC 6901) to the offending member of the body, e.g.
            `/timezone`, or the name of the offending parameter.
        message: { type: string }

    SyncMeta:
      type: object
      required: [version, created_at, updated_at]
      properties:
        version:
          type: integer
          readOnly: true
          description: Incremented on every write to the resource.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    Position:
      type: string
      minLength: 1
      maxLength: 100
      description: Fractional index generated by the client; ordered lexicographically, ties broken by id.

    Color:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      nullable: true

    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '09:00'

    TimeZone:
      type: string
      maxLength: 64
      description: IANA time zone name.
      example: Europe/Madrid

    User:
      type: object
      required: [id, timezone, all_day_reminder_time, inbox_list_id]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        timezone: { $ref: '#/components/schemas/TimeZone' }
        all_day_reminder_time: { $ref: '#/components/schemas/LocalTime' }
        inbox_list_id: { type: string, format: uuid }

    UserPatch:
      type: object
      additionalProperties: false
      properties:
        timezone: { $ref: '#/components/schemas/TimeZone' }
        all_day_reminder_time: { $ref: '#/components/schemas/LocalTime' }

    ListRole:
      type: string
      enum: [owner, editor, viewer]

    List:
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [id, name, position, is_inbox, role]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, minLength: 1, maxLength: 200 }
            color: { $ref: '#/components/schemas/Color' }
            position: { $ref: '#/components/schemas/Position' }
            is_inbox: { type: boolean, readOnly: true }
            role:
              allOf:
                - $ref: '#/components/schemas/ListRole'
              readOnly: true
              description: Caller's role. Always `owner` in V1.

    ListCreate:
      type: object
      additionalProperties: false
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        color: { $ref: '#/components/schemas/Color' }
        position: { $ref: '#/components/schemas/Position' }

    ListPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        color: { $ref: '#/components/schemas/Color' }
        position: { $ref: '#/components/schemas/Position' }

    TaskStatus:
      type: string
      enum: [open, done, dropped]

    RepeatFrom:
      type: string
      enum: [due, completion]

    RRule:
      type: string
      maxLength: 200
      nullable: true
      description: RFC 5545 RRULE restricted to the subset in SPEC section 5. Requires `due_date`.
      example: FREQ=WEEKLY;INTERVAL=2;BYDAY=MO,WE

    Task:
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required:
            - id
            - list_id
            - title
            - description
            - status
            - priority
            - position
            - repeat_from
            - recurrence_done_count
            - tag_ids
          properties:
            id: { type: string, format: uuid }
            list_id: { type: string, format: uuid }
            title: { type: string, minLength: 1, maxLength: 500 }
            description: { type: string, maxLength: 20000 }
            status: { $ref: '#/components/schemas/TaskStatus' }
            priority:
              type: integer
              minimum: 0
              maximum: 3
              description: 0 none, 1 low, 2 medium, 3 high.
            position: { $ref: '#/components/schemas/Position' }
            due_date:
              type: string
              format: date
              nullable: true
            due_time:
              allOf:
                - $ref: '#/components/schemas/LocalTime'
              nullable: true
              description: Requires `due_date`.
            due_tz:
              allOf:
                - $ref: '#/components/schemas/TimeZone'
              nullable: true
              description: Requires `due_time`. Null means floating time in the user's current zone.
            rrule: { $ref: '#/components/schemas/RRule' }
            repeat_from: { $ref: '#/components/schemas/RepeatFrom' }
            recurrence_done_count: { type: integer, readOnly: true }
            completed_at:
              type: string
              format: date-time
              nullable: true
              readOnly: true
            tag_ids:
              type: array
              maxItems: 50
              items: { type: string, format: uuid }
            checklist_items:
              type: array
              readOnly: true
              description: Live items ordered by position. Omitted in /sync/changes.
              items: { $ref: '#/components/schemas/ChecklistItem' }
            reminders:
              type: array
              readOnly: true
              description: Live reminders. Omitted in /sync/changes.
              items: { $ref: '#/components/schemas/Reminder' }

    TaskCreate:
      type: object
      additionalProperties: false
      required: [id, list_id, title, position]
      properties:
        id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 20000, default: '' }
        priority: { type: integer, minimum: 0, maximum: 3, default: 0 }
        position: { $ref: '#/components/schemas/Position' }
        due_date: { type: string, format: date, nullable: true }
        due_time:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          nullable: true
        due_tz:
          allOf:
            - $ref: '#/components/schemas/TimeZone'
          nullable: true
        rrule: { $ref: '#/components/schemas/RRule' }
        repeat_from:
          allOf:
            - $ref: '#/components/schemas/RepeatFrom'
          default: due
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        checklist_items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ChecklistItemCreate' }
        reminders:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ReminderCreate' }

    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        list_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 20000 }
        status:
          type: string
          enum: [open, dropped]
        priority: { type: integer, minimum: 0, maximum: 3 }
        position: { $ref: '#/components/schemas/Position' }
        due_date: { type: string, format: date, nullable: true }
        due_time:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          nullable: true
        due_tz:
          allOf:
            - $ref: '#/components/schemas/TimeZone'
          nullable: true
        rrule: { $ref: '#/components/schemas/RRule' }
        repeat_from: { $ref: '#/components/schemas/RepeatFrom' }
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }

    TaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_cursor:
          type: string
          nullable: true

    ChecklistItem:
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [id, task_id, title, is_done, position]
          properties:
            id: { type: string, format: uuid }
            task_id: { type: string, format: uuid, readOnly: true }
            title: { type: string, minLength: 1, maxLength: 500 }
            is_done: { type: boolean }
            position: { $ref: '#/components/schemas/Position' }

    ChecklistItemCreate:
      type: object
      additionalProperties: false
      required: [id, title, position]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        is_done: { type: boolean, default: false }
        position: { $ref: '#/components/schemas/Position' }

    ChecklistItemPatch:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        is_done: { type: boolean }
        position: { $ref: '#/components/schemas/Position' }

    ReminderKind:
      type: string
      enum: [relative, absolute, snooze]

    Reminder:
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [id, task_id, kind]
          properties:
            id: { type: string, format: uuid }
            task_id: { type: string, format: uuid, readOnly: true }
            kind: { $ref: '#/components/schemas/ReminderKind' }
            offset_minutes:
              type: integer
              minimum: 0
              maximum: 40320
              nullable: true
              description: Only for `relative`. Minutes before the due instant.
            at:
              type: string
              format: date-time
              nullable: true
              description: Only for `absolute` and `snooze`.
            next_fire_at:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: Computed by the server. Null when nothing is pending.

    ReminderCreate:
      type: object
      additionalProperties: false
      required: [id, kind]
      description: Exactly one of `offset_minutes` (relative) or `at` (absolute) must be set.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [relative, absolute]
        offset_minutes: { type: integer, minimum: 0, maximum: 40320, nullable: true }
        at: { type: string, format: date-time, nullable: true }

    ReminderPatch:
      type: object
      additionalProperties: false
      description: The kind cannot change. Send the field matching the reminder's kind.
      properties:
        offset_minutes: { type: integer, minimum: 0, maximum: 40320 }
        at: { type: string, format: date-time }

    Tag:
      allOf:
        - $ref: '#/components/schemas/SyncMeta'
        - type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, minLength: 1, maxLength: 50 }
            color: { $ref: '#/components/schemas/Color' }

    TagCreate:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { $ref: '#/components/schemas/Color' }

    TagPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { $ref: '#/components/schemas/Color' }

    CompleteRequest:
      type: object
      additionalProperties: false
      required: [completion_id]
      properties:
        completion_id:
          type: string
          format: uuid
          description: Generated by the client; makes the call idempotent.
        occurrence_due_date:
          type: string
          format: date
          nullable: true
          description: The `due_date` the client saw. Required when the task has a due date.
        completed_at:
          type: string
          format: date-time
          description: When the user acted. Defaults to now; future values are clamped to now.

    Completion:
      type: object
      required: [id, task_id, kind, completed_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        kind:
          type: string
          enum: [completed, skipped]
        occurrence_due_date: { type: string, format: date, nullable: true }
        completed_at: { type: string, format: date-time }

    TaskSummary:
      type: object
      required: [id, list_id, title, priority]
      properties:
        id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        title: { type: string }
        priority: { type: integer, minimum: 0, maximum: 3 }
        rrule:
          type: string
          nullable: true
          description: Set when the task is recurring.

    CompletionEntry:
      allOf:
        - $ref: '#/components/schemas/Completion'
        - type: object
          required: [task, can_undo]
          properties:
            task: { $ref: '#/components/schemas/TaskSummary' }
            can_undo:
              type: boolean
              description: True when this is the latest record of its task, so /uncomplete accepts it.

    CompletionResult:
      type: object
      required: [applied, task]
      properties:
        applied:
          type: boolean
          description: |
            False when the call was a no-op: a stale occurrence, or an unknown id on
            /uncomplete. A repeated `completion_id` on /complete or /skip answers true
            with the existing completion (SPEC D-24).
        task: { $ref: '#/components/schemas/Task' }
        completion:
          allOf:
            - $ref: '#/components/schemas/Completion'
          nullable: true

    ChangesPage:
      type: object
      required: [lists, tasks, checklist_items, reminders, tags, next_cursor, has_more]
      properties:
        lists:
          type: array
          items: { $ref: '#/components/schemas/List' }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        checklist_items:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
        reminders:
          type: array
          items: { $ref: '#/components/schemas/Reminder' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        next_cursor:
          type: string
          description: Pass it in the next call, also when `has_more` is false.
        has_more: { type: boolean }

    PushChannel:
      type: string
      enum: [webpush]
      description: V1 supports only `webpush`. Future values, e.g. `fcm`, `unifiedpush`, `email`.

    PushSubscription:
      type: object
      required: [id, channel, created_at]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/PushChannel' }
        label: { type: string, maxLength: 100, nullable: true }
        created_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }

    PushSubscriptionCreate:
      type: object
      additionalProperties: false
      required: [id, channel, endpoint, keys]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/PushChannel' }
        endpoint: { type: string, format: uri, maxLength: 2000 }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 200 }
            auth: { type: string, maxLength: 100 }
        label: { type: string, maxLength: 100, nullable: true }
